name: Update Coverage Badge
on:
  workflow_dispatch:

jobs:
  update-badge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      PYTHONPATH: /github/workspace/.ci_env:/usr/share/qgis/python/plugins:/usr/share/qgis/python
      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Исправляем права для безопасной работы git внутри Docker-контейнера
      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /github/workspace

      - name: Fix home directory ownership for caching
        run: chown -R root:root /github/home

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt

      - name: Create plugin structure link
        run: |
          mkdir -p /github/workspace/.ci_env
          ln -s /github/workspace /github/workspace/.ci_env/QGIS_VDO

      - name: Run pytest with coverage
        run: |
          # Исправлены переносы строк (\) и добавлен пайп (| tee) для сохранения вывода
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
            -v \
            --junitxml=pytest.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov | tee pytest-coverage.txt
        
      - name: Coverage comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.1.52
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          hide-comment: true

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: ./htmlcov/
          retention-days: 14

      - name: Update README
        run: |
          # Обновляем блок комментариев в README.md
          sed -i '/<!-- Pytest Coverage Comment:Begin -->/,/<!-- Pytest Coverage Comment:End -->/c\<!-- Pytest Coverage Comment:Begin -->\n${{ steps.coverage.outputs.coverageHtml }}\n<!-- Pytest Coverage Comment:End -->' ./README.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: update coverage badge [skip ci]'
          file_pattern: README.md
