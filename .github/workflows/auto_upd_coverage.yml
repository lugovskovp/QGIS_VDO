name: Update Coverage Badge
on:
#   push:
#     branches: [main]
    workflow_dispatch:



jobs:
  update-badge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
        contents: write

    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      # Направляем Python в нашу виртуальную структуру
      PYTHONPATH: /github/workspace/.ci_env:/usr/share/qgis/python/plugins:/usr/share/qgis/python
      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore

    steps:
        -   uses: actions/checkout@v6
            with:
                persist-credentials: false
                fetch-depth: 0

        -   name: Fix home directory ownership for caching
            run: chown -R root:root /github/home

        -   name: Install system dependencies
            run: |
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends xvfb

        -   name: Install Python dependencies
            run: |
                python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt

            # СОЗДАЕМ ВИРТУАЛЬНОЕ ОКРУЖЕНИЕ ДЛЯ ИМПОРТОВ QGIS_VDO
        -   name: Create plugin structure link
            run: |
                mkdir -p /github/workspace/.ci_env
                ln -s /github/workspace /github/workspace/.ci_env/QGIS_VDO

        -   name: Run pytest with coverage
            run: |
                # В этом режиме убираем --import-mode=importlib, так как мы сами контролируем sys.path через PYTHONPATH
                xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
                    -v \
                    --junitxml=pytest.xml
                    --cov=. \
                    --cov-report=term-missing \
                    --cov-report=xml:coverage.xml \
                    --cov-report=html:htmlcov
                tee pytest-coverage.txt
        
        -   name: Coverage comment
            id: coverage
            uses: MishaKav/pytest-coverage-comment@v1
            with:
                pytest-coverage-path: ./pytest-coverage.txt
                junitxml-path: ./pytest.xml
                hide-comment: true

        # СОХРАНЕНИЕ HTML-ОТЧЕТА В АРТЕФАКТЫ GITHUB
        -   name: Upload HTML coverage artifact
            uses: actions/upload-artifact@v4
            with:
                name: html-coverage-report
                path: ./htmlcov/
                retention-days: 14  # Срок хранения артефакта в GitHub (дней)

        -   name: Update README
            run: |
                sed -i '/<!-- Pytest Coverage Comment:Begin -->/,/<!-- Pytest Coverage Comment:End -->/c\<!-- Pytest Coverage Comment:Begin -->\n${{ steps.coverage.outputs.coverageHtml }}\n<!-- Pytest Coverage Comment:End -->' ./README.md

        -   name: Commit changes
            uses: stefanzweifel/git-auto-commit-action@v5
            with:
                commit_message: 'docs: update coverage badge'
                file_pattern: README.md