name: Update Coverage Badge
on:
  workflow_dispatch:

jobs:
  update-badge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      PYTHONPATH: /github/workspace/.ci_env:/usr/share/qgis/python/plugins:/usr/share/qgis/python
      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Исправляем права для безопасной работы git внутри Docker-контейнера
      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /github/workspace

      - name: Fix home directory ownership for caching
        run: chown -R root:root /github/home

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt

      - name: Create plugin structure link
        run: |
          mkdir -p /github/workspace/.ci_env
          ln -s /github/workspace /github/workspace/.ci_env/QGIS_VDO

      - name: Run pytest with coverage
        run: |
          # Исправлены переносы строк (\) и добавлен пайп (| tee) для сохранения вывода
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
            -v \
            --junitxml=pytest.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov | tee pytest-coverage.txt
        
      - name: Coverage comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.1.52
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          hide-comment: true # Нам не нужно комментировать PR, так как мы запускаем из main

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: ./htmlcov/
          retention-days: 14

      # РЕШЕНИЕ: Записываем HTML-вывод экшена в файл и пушим в отдельную ветку
      - name: Deploy Coverage Report to Separate Branch
        run: |
          # 1. Исправляем ошибку Git "dubious ownership" для безопасной работы внутри Docker
          git config --global --add safe.directory /github/workspace
          
          # 2. Создаем изолированную папку для деплоя
          mkdir -p deploy_report
          
          # 3. Достаем HTML-код таблицы из outputs экшена и сохраняем как README.md
          cat << 'EOF' > deploy_report/README.md
          # 📊 Отчет о покрытии тестами (QGIS Plugin Coverage)
          
          EOF
          
          # Записываем сгенерированную экшеном таблицу
          echo "${{ steps.coverage.outputs.coverageHtml }}" >> deploy_report/README.md

          # 4. Инициализируем чистую ветку и отправляем на GitHub
          cd deploy_report
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b coverage-report
          git add README.md
          git commit -m "chore: update coverage report [skip ci]"
          
          # Безопасный пуш через GITHUB_TOKEN в обход защиты ветки main
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git" coverage-report --force


