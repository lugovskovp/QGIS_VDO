name: Update Coverage Badge
on:
  workflow_dispatch:

jobs:
  update-badge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      PYTHONPATH: /github/workspace/.ci_env:/usr/share/qgis/python/plugins:/usr/share/qgis/python
      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Исправляем права для безопасной работы git внутри Docker-контейнера
      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /github/workspace

      - name: Fix home directory ownership for caching
        run: chown -R root:root /github/home

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt

      - name: Create plugin structure link
        run: |
          mkdir -p /github/workspace/.ci_env
          ln -s /github/workspace /github/workspace/.ci_env/QGIS_VDO

      - name: Run pytest with coverage
        run: |
          # Исправлены переносы строк (\) и добавлен пайп (| tee) для сохранения вывода
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
            -v \
            --junitxml=pytest.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov
        
      - name: Coverage comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1.1.52
        with:
          pytest-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml
          hide-comment: true # Нам не нужно комментировать PR, так как мы запускаем из main

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: ./htmlcov/
          retention-days: 14

      # РЕШЕНИЕ: Записываем HTML-вывод экшена в файл и пушим в отдельную ветку
            # РЕШЕНИЕ: Исправляем синтаксис пуша через переменные окружения GitHub
      - name: Deploy Coverage Report to Separate Branch
        run: |
          # 1. Разрешаем Git работать в папке Docker-контейнера
          git config --global --add safe.directory /github/workspace
          
          # 2. Настраиваем пользователя
          git config --global user.email "github-actions[bot]@://github.com"
          git config --global user.name "github-actions[bot]"
          
          # 3. Создаем временный файл с HTML-таблицей отчета
          cat << 'EOF' > coverage_readme.md
          # 📊 Отчет о покрытия тестами (QGIS Plugin Coverage)
          
          EOF
          echo "${{ steps.coverage.outputs.coverageHtml }}" >> coverage_readme.md

          # 4. Переключаемся на изолированную ветку 'coverage-report' (создаем её как сиротскую)
          git checkout --orphan coverage-report
          
          # 5. Очищаем индекс ветки, чтобы там не было кода плагина
          git rm -rf . --cached > /dev/null 2>&1
          rm -rf *
          
          # 6. Возвращаем наш файл отчета и переименовываем в README.md
          mv coverage_readme.md README.md
          
          # 7. Фиксируем изменения и пушим в репозиторий через существующее подключение
          git add README.md
          git commit -m "chore: update coverage report [skip ci]"
          git push origin coverage-report --force


