name: Release & Package QGIS Plugin

on:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install python-semantic-release hatch

      - name: Run Semantic Release (Determine version & update files)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          # PSR обновляет файлы, делает локальный коммит релиза, локальный тег и генерирует changelog
          semantic-release version --no-push

      # Пушим коммит бота (с обновленным metadata.txt) и тег в GitHub
      - name: Push Changes & Tags to GitHub
        if: steps.release.outputs.released == 'true'
        run: |
          git push origin HEAD
          git push origin --tags

      - name: Package QGIS Plugin to ZIP
        if: steps.release.outputs.released == 'true'
        run: |
          PLUGIN_NAME="QGIS_VDO"
          mkdir -p build_dir/$PLUGIN_NAME
          hatch build --target sdist
          tar -xzf dist/*.tar.gz -C build_dir/$PLUGIN_NAME --strip-components=1
          rm -f build_dir/$PLUGIN_NAME/PKG-INFO
          cd build_dir
          zip -r "../dist/${PLUGIN_NAME}.zip" "$PLUGIN_NAME"
          cd ..
          echo "ZIP package successfully created at dist/${PLUGIN_NAME}.zip"

      - name: Upload Artifact to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/QGIS_VDO.zip';
            
            // 1. Берем сырой тег и принудительно вычищаем из него любые непечатаемые символы (включая \u000b)
            const rawTag = "${{ steps.release.outputs.tag }}";
            const tagName = rawTag.replace(/[^\x20-\x7E]/g, "").trim();
            
            // 2. Безопасно получаем текст изменений (changelog) напрямую из контекста джобы
            const changelogBody = `${{ steps.release.outputs.changelog }}`.trim() || "Initial description for development release.";
            
            console.log(`Cleared Tag Name to submit: "${tagName}"`);
            
            // 3. Отправляем запрос к API GitHub на создание релиза
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${tagName}`,
              draft: false,
              prerelease: tagName.includes('-dev'),
              body: changelogBody
            });
            
            // 4. Загружаем ZIP-архив плагина QGIS
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'QGIS_VDO.zip',
              data: fs.readFileSync(path)
            });
