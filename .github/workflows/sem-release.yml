name: Release & Package QGIS Plugin

on:
  push:
    branches:
      - main
      - dev
    #   - 104-hatch-вместо-setuptools

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Обновлено до v4 (или v5, если доступно в маркетплейсе)
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Обновлено до v5 (или актуальной мажорной версии)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install python-semantic-release hatch

      - name: Run Semantic Release (Determine version & update files)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # --- ИСПРАВЛЕНО: добавляем флаг --no-vcs-release ---
          # Это запретит PSR создавать релиз через API, но он успешно сделает 
          # локальный коммит с обновленными metadata.txt и __about__.py
          semantic-release version --no-push
        #   semantic-release version --no-vcs-release

        # Принудительно пушим созданный коммит и тег в GitHub, чтобы шаг релиза их увидел
      - name: Push Changes & Tags to GitHub
        if: steps.release.outputs.released == 'true'
        run: |
          git push origin HEAD
          git push origin --tags


      - name: Package QGIS Plugin to ZIP
        if: steps.release.outputs.released == 'true'
        run: |
          PLUGIN_NAME="QGIS_VDO"
          mkdir -p build_dir/\$PLUGIN_NAME
          hatch build --target sdist
          tar -xzf dist/*.tar.gz -C build_dir/\$PLUGIN_NAME --strip-components=1
          rm -f build_dir/\$PLUGIN_NAME/PKG-INFO
          cd build_dir
          zip -r "../dist/\({PLUGIN_NAME}.zip" "\)PLUGIN_NAME"
          cd ..
          echo "ZIP package successfully created at dist/\${PLUGIN_NAME}.zip"


      - name: Upload Artifact to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/QGIS_VDO.zip';
            const tagName = "\${{ steps.release.outputs.tag }}";
            
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${tagName}`,
              draft: false,
              prerelease: tagName.includes('-dev')
            });
            
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'QGIS_VDO.zip',
              data: fs.readFileSync(path)
            });
