name: Release & Package QGIS Plugin

on:
  push:
    branches:
      - main
      - dev
    #   - 104-hatch-вместо-setuptools

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Обновлено до v4 (или v5, если доступно в маркетплейсе)
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Обновлено до v5 (или актуальной мажорной версии)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install python-semantic-release hatch

      - name: Run Semantic Release (Determine version & update files)
        id: release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          semantic-release version

      - name: Package QGIS Plugin to ZIP
        if: steps.release.outputs.released == 'true'
        run: |
          # 1. Задаем имя папки плагина внутри архива
          PLUGIN_NAME="QGIS_VDO"
          
          # 2. Создаем чистую временную структуру сборки
          mkdir -p build_dir/$PLUGIN_NAME
          
          # 3. Собираем исходники через Hatch (sdist)
          hatch build --target sdist
          
          # 4. Распаковываем созданный .tar.gz архив во временную папку
          tar -xzf dist/*.tar.gz -C build_dir/$PLUGIN_NAME --strip-components=1
          
          # --- ДОБАВЛЕНО: Удаляем лишние файлы метаданных Python пакета ---
          rm -f build_dir/$PLUGIN_NAME/PKG-INFO
          
          # 5. Упаковываем очищенную структуру в финальный ZIP-архив
          cd build_dir
          zip -r "../dist/${PLUGIN_NAME}.zip" "$PLUGIN_NAME"
          cd ..
          
          echo "ZIP package successfully created at dist/${PLUGIN_NAME}.zip"


      # Используем официальный нативный шаг релиза от самого GitHub (вместо стороннего softprops)
      # Он гарантированно работает на актуальной версии Node.js
      - name: Upload Artifact to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/QGIS_VDO.zip';
            
            // Получаем информацию о созданном теге
            const tagName = "\${{ steps.release.outputs.tag }}";
            
            // Создаем или находим релиз
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${tagName}`,
              draft: false,
              prerelease: tagName.includes('-dev') // автоматически ставит флаг пререлиза для dev-веток
            });
            
            // Загружаем наш ZIP архив в релиз
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'QGIS_VDO.zip',
              data: fs.readFileSync(path)
            });
