name: Release & Package QGIS Plugin

on:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install python-semantic-release hatch

      - name: Run Semantic Release (Determine version & update files)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          # PSR обновляет файлы, делает локальный коммит релиза, локальный тег и генерирует changelog
          semantic-release version --no-push

      # Пушим коммит бота (с обновленным metadata.txt) и тег в GitHub
      - name: Push Changes & Tags to GitHub
        if: steps.release.outputs.released == 'true'
        run: |
          git push origin HEAD
          # Отправляем теги с флагом --force, чтобы обновить тег на сервере, 
          # если он завис там во время прошлых отладочных запусков
          git push origin --tags --force
          

      - name: Package QGIS Plugin to ZIP
        if: steps.release.outputs.released == 'true'
        run: |
          PLUGIN_NAME="QGIS_VDO"
          mkdir -p build_dir/$PLUGIN_NAME
          hatch build --target sdist
          tar -xzf dist/*.tar.gz -C build_dir/$PLUGIN_NAME --strip-components=1
          rm -f build_dir/$PLUGIN_NAME/PKG-INFO
          cd build_dir
          zip -r "../dist/${PLUGIN_NAME}.zip" "$PLUGIN_NAME"
          cd ..
          echo "ZIP package successfully created at dist/${PLUGIN_NAME}.zip"


      - name: Upload Artifact to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: actions/github-script@v7
        env:
          RAW_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/QGIS_VDO.zip';
            const tagName = process.env.RAW_TAG.trim();
            
            console.log(`Submitting release for tag: "${tagName}" with auto-generated notes`);
            
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${tagName}`,
              draft: false,
              prerelease: tagName.includes('-dev'),
              generate_release_notes: true // Включаем нативный генератор заметок GitHub
            });
            
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'QGIS_VDO.zip',
              data: fs.readFileSync(path)
            });

