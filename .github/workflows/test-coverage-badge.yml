name: Release Tests (Docker + Coverage Badge)

on:
  workflow_dispatch:

jobs:
  test-and-coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    # ВАЖНО: разрешаем запись в репозиторий для обновления бейджа
    permissions:
      contents: write

    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      # Направляем Python в нашу виртуальную структуру
      PYTHONPATH: /github/workspace/.ci_env:/usr/share/qgis/python/plugins:/usr/share/qgis/python
      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fix home directory ownership for caching
        run: chown -R root:root /github/home

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/pip
          key: ${{ runner.os }}-pip-docker-${{ hashFiles('.github/workflows/test-coverage.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docker-

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt

      # СОЗДАЕМ ВИРТУАЛЬНОЕ ОКРУЖЕНИЕ ДЛЯ ИМПОРТОВ QGIS_VDO
      - name: Create plugin structure link
        run: |
          mkdir -p /github/workspace/.ci_env
          ln -s /github/workspace /github/workspace/.ci_env/QGIS_VDO

      - name: Run pytest with coverage
        run: |
          # В этом режиме убираем --import-mode=importlib, так как мы сами контролируем sys.path через PYTHONPATH
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
            -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-commenter@v1.1.52
        with:
          pytest-coverage-path: ./coverage.xml
          junitxml-path: ./pytest.xml

      # 2. СОХРАНЕНИЕ HTML-ОТЧЕТА В АРТЕФАКТЫ GITHUB
      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: ./htmlcov/
          retention-days: 14  # Срок хранения артефакта в GitHub (дней)
      
      # Извлекаем точный процент покрытия из coverage.xml и обновляем JSON для Shields.io
      - name: Generate Coverage Badge JSON
        run: |
          # Вытаскиваем значение line-rate из XML (например, 0.6543)
          LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' coverage.xml | head -n 1)
          # Переводим в проценты и округляем до целого числа (0.6543 -> 65)
          COVERAGE_PERCENT=$(python3 -c "print(round($LINE_RATE * 100))")
          echo "Calculated coverage: ${COVERAGE_PERCENT}%"
          
          # Определяем цвет в зависимости от уровня покрытия
          if [ "$COVERAGE_PERCENT" -ge 80 ]; then COLOR="green";
          elif [ "$COVERAGE_PERCENT" -ge 60 ]; then COLOR="yellowgreen";
          elif [ "$COVERAGE_PERCENT" -ge 40 ]; then COLOR="yellow";
          else COLOR="red"; fi
          
          # Записываем эти переменные в окружение GitHub для следующего шага
          echo "COV_PERC=${COVERAGE_PERCENT}" >> $GITHUB_ENV
          echo "COV_COLOR=${COLOR}" >> $GITHUB_ENV

      - name: Update Badge JSON in repository
        uses: schnerring/github-dot-github-action@v1.1.0
        with:
          # Создает и обновляет файл .github/badges/coverage.json в вашем репозитории
          path: .github/badges/coverage.json
          content: |
            {
              "schemaVersion": 1,
              "label": "coverage",
              "message": "${{ env.COV_PERC }}%",
              "color": "${{ env.COV_COLOR }}"
            }