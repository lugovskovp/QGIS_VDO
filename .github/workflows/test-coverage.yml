name: QGIS Plugin Release Tests (Docker + Coverage)

on:
  workflow_dispatch:

jobs:
  test-and-coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      # Задаем PYTHONPATH относительно нашей будущей симлинки
      PYTHONPATH: ${{ github.workspace }}/.symlink_root:/usr/share/qgis/python/plugins:/usr/share/qgis/python
      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fix home directory ownership for caching
        run: chown -R root:root /github/home

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/pip
          key: ${{ runner.os }}-pip-docker-${{ hashFiles('.github/workflows/test-coverage.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docker-

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt

      # СОЗДАЕМ СИМЛИНКУ: Теперь папка QGIS_VDO физически существует для Python
      - name: Create plugin structure link
        run: |
          mkdir -p .symlink_root
          ln -s "${{ github.workspace }}" .symlink_root/QGIS_VDO

      - name: Run pytest with coverage
        run: |
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
            -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
          retention-days: 28
