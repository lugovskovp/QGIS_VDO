name: QGIS Plugin Release Tests (Docker + Coverage)

on:
  workflow_dispatch:

jobs:
  test-and-coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      PYTHONPATH: ${{ github.workspace }}/..:/usr/share/qgis/python/plugins:/usr/share/qgis/python      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore  # Отключает предупреждение о root для всех шагов

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fix home directory ownership for caching
        run: chown -R root:root /github/home

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/pip
          key: ${{ runner.os }}-pip-docker-${{ hashFiles('.github/workflows/test-coverage.yml') }} # ИСПРАВЛЕНО имя файла
          restore-keys: |
            ${{ runner.os }}-pip-docker-

      # ОПТИМИЗАЦИЯ: Убрали python3-pip из apt-get, так как он уже есть в контейнере QGIS
      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb

      # ИСПРАВЛЕНИЕ: Ставим зависимости напрямую через встроенный pip с флагом безопасности
      # ИСПРАВЛЕНИЕ: Исправлен флаг pip для обхода PEP 668
      - name: Install Python dependencies
        run: |
          # python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt          # python3 -m pip install --upgrade pip
          # python3 -m pip install pytest pytest-qgis bitarray pytest-cov
          
      #python3 -m pip install --break-system-packages pytest pytest-qgis bitarray pytest-cov

      - name: Run pytest with coverage
        run: |
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
            -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      # Шаг без изменений — сохраняет отчет покрытия в артефакты
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
          retention-days: 28
