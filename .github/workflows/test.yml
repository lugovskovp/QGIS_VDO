name: pip install QGIS_VDO, Test and Coverage

on:
  workflow_dispatch:

jobs:
  install-test-and-coverage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    container:
      image: qgis/qgis:3.44.10-noble
      options: --user root

    env:
      # ДОБАВЛЯЕМ ПАПКУ tests ЧЕРЕЗ ДВОЕТОЧИЕ В КОНЕЦ ПУТИ PYTHONPATH
      PYTHONPATH: /usr/share/qgis/python/plugins:/usr/share/qgis/python:${{ github.workspace }}/tests
      QT_QPA_PLATFORM: offscreen
      PIP_ROOT_USER_ACTION: ignore

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fix home directory ownership for caching
        run: chown -R root:root /github/home

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/pip
          key: ${{ runner.os }}-pip-docker-${{ hashFiles('.github/workflows/test-coverage.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docker-

      - name: Install system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb

      - name: Install Python dependencies and Plugin
        run: |
          # Устанавливаем утилиты тестирования
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-cov pytest-mock pytest-qt
          
          # КЛЮЧЕВОЙ МОМЕНТ: Устанавливаем сам плагин в систему как пакет QGIS_VDO
          # Флаг -e (editable) свяжет имя QGIS_VDO напрямую с текущей папкой коммита
          python3 -m pip install --break-system-packages -e .

      - name: Run pytest with coverage
        run: |
          # Флаг --import-mode=importlib заставит pytest изолировать пути тестов от путей исходников
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" pytest tests/ \
            -v \
            --import-mode=importlib \
            --cov=QGIS_VDO \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
          retention-days: 28
