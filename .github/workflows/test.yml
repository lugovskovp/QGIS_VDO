name: ChatGPT Test and Coverage

on:
  workflow_dispatch:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    
    # Запуск всей работы внутри стабильного контейнера QGIS (Ubuntu noble + Python 3.12)
    container:
      image: qgis/qgis:3.44.10-noble

    steps:
      # 1. Скачивание исходного кода плагина
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Подготовка системного окружения внутри контейнера
      - name: Install system dependencies
        run: |
          apt-get update
          # xvfb нужен для эмуляции дисплея (чтобы тесты интерфейса/PyQt5 не падали)
          apt-get install -y xvfb python3-pip

      # 3. Обновление pip и установка утилит тестирования и покрытия
      - name: Install Python test tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-cov pytest-mock pytest-qt

      # 4. Запуск тестов под виртуальным фреймбуфером (xvfb) с генерацией покрытия
      # При первом же импорте плагина сработает ваш код автоустановки и доставит bitarray!
      - name: Run tests with coverage
        env:
          QGIS_PLUGIN_IN_CI: 1
        run: |
          xvfb-run -s "+extension GLX -screen 0 1024x768x24" \
          pytest -v --cov=. --cov-report=xml --cov-report=term-missing

      # 5. Сохранение XML-отчета покрытия в артефакты сборки
      - name: Upload coverage artifact
        uses: actions/artifacts@v4
        with:
          name: coverage-report
          path: coverage.xml
