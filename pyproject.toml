[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "QGIS_VDO"
dynamic = ["version"]
description = 'Viewing cartographic information from Carindb VDO car navigation files in QGIS.'
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
keywords = ["qgis", "pyqgis", "gis", "plugin"]
authors = [{ name = "Paul Lugovskov", email = "p.lugovskov@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Intended Audience :: Science/Research",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = ["bitarray"]

[project.urls]
Documentation = "https://github.com"
Issues = "https://github.com"
Source = "https://github.com/lugovskovp/QGIS_VDO"

# --- Настройка версии для Hatch (из __about__.py) ---
[tool.hatch.version]
source = "regex"
path = "metadata.txt"
pattern = '^version\s*=\s*(?P<version>[^\s]+)'

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=1.0.0"]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:vdo tests}"

# --- Корректный File Selection для sdist (включая ресурсы плагина) ---
[tool.hatch.build.targets.sdist]
# Перечисляем только то, что ДОЛЖНО уйти клиенту/на сервер
include = [
  "/__init__.py",
  "/metadata.txt",
  "/README.md",
  "/settings.py",
  "/vdo_explorer.py",
  "/vdo_threading.py",
  "/resources",
  "/ui_files",
  "/vdo",
  "/vdo/__about__.py",
]
# Исключаем файлы и папки из архива исходного кода (.tar.gz)
exclude = [
  "/.env",
  "/.pre-commit-config.yaml",
  "/tests",
  "/.github",
  "/.vscode",
  "/.gigacode_vsc",
]

[tool.hatch.build.targets.sdist.rewriters]
# Этот хук автоматически заменит версию в metadata.txt прямо во время команды hatch build
"metadata.txt" = [{ search = "version=1.0.0-dev.4", replace = "{version}" }]


[tool.hatch.build.targets.wheel]
bypass = true # Защита от багов Windows/OSGeo4W окружения при сборке

[tool.semantic_release]
# Указываем парсер (angular используется по умолчанию)
commit_parser = "angular"
# Удаляем связь с project.version, чтобы не провоцировать строгий PEP 440 парсинг внутри TOML
version_toml = []
version_variables = ["metadata.txt:version", "vdo/__about__.py:__version__"]

# Настройка автозамены в метаданных QGIS
# [[tool.semantic_release.text_replacements]]
# path = "metadata.txt"
# search = "version={version}"
# replace = "version={new_version}"


[tool.semantic_release.commit_parser_options]
# Список префиксов, которые будут увеличивать MINOR версию (новые фичи)
allowed_tags = [
  "feat",
  "fix",
  "perf",
  "docs",
  "style",
  "refactor",
  "test",
  "chore",
  "build",    # Изменение системы сборки, зависимостей, пакетов	build
  "revert",   #	Откат предыдущего коммита
]

# Связываем префиксы с типами изменений (major, minor, patch)
minor_tags = ["feat", "revert"]
patch_tags = ["fix", "perf", "build", "refactor"]

# Настройка поведения веток: main - релиз, dev - пререлиз
[tool.semantic_release.branches.main]
# Указываем PSR точечно менять строки по регексам в обоих файлах
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev" # Сработает для dev и для вашей текущей ветки
# match = "(dev|104-hatch-вместо-setuptools)" # Сработает для dev и для вашей текущей ветки
prerelease = true
prerelease_token = "dev" # Версия будет вида X.Y.Z-dev.1


[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = "."
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "build", "dist", "ext_libs"]
addopts = ["-v", "--tb=short", "--strict-markers"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "slow: Длинные или интеграционные тесты.",
  "smoke: Быстрые тесты базовой работоспособности.",
]

[tool.coverage.run]
source_pkgs = ["vdo"]
branch = true
parallel = true
omit = ["vdo/__about__.py", "ext_libs/*"]

[tool.coverage.paths]
vdo = ["vdo", "*/QGIS_VDO/vdo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "__repr__",
  "if __name__ == .__main__:",
  "if __name__ == \"__main__\":",
  "if __name__ == '__main__':",
  "raise NotImplementedError",
  "no cov",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.default]
type = "system"
detached = true
skip-install = true
