[tool:pytest]
# pytest --durations=0 >test-durations.txt   -- duration all

# Минимально требуемая версия pytest
minversion = 7.0

# Добавляет корень проекта в sys.path для корректных импортов вида `from vdo...`
pythonpath = .

# Указываем, где именно искать тесты
testpaths = tests

# Исключение папок из поиска тестов (pytest не будет в них заходить)
norecursedirs = 
    имя_папки_для_исключения
    .git
    .pytest_cache
    build
    dist
    ext_libs

# Базовые флаги запуска по умолчанию
# -v: подробный вывод
# --tb=short: лаконичные логи ошибок
# --strict-markers: строгий контроль кастомных маркеров
# pip install pytest-xdist
# # Запустить тесты на всех доступных ядрах процессора
# pytest -n auto ?
addopts = -v --tb=short --strict-markers

# Правила поиска тестовых файлов, классов и функций
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Регистрация ваших кастомных меток
markers =
    slow: Длинные или интеграционные тесты.
    smoke: Быстрые тесты базовой работоспособности.
# @pytest.mark.slow
# pytest -m "not slow"
# pytest -m slow



[coverage:run]
branch = true
# Исключение папки из анализа покрытия (строки внутри неё не будут учитываться в % coverage)
omit = 
    имя_папки_для_исключения/*
    # tests/*
    # setup.py
    ext_libs/*


[coverage:report]
# Специальные правила для вывода отчета
show_missing = True
skip_covered = True


# Исключение отдельных строк из покрытия по ключевым словам/комментариям
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise NotImplementedError
